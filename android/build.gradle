group 'com.mssql.mssql_io'
version '0.0.4'

buildscript {
    ext.kotlin_version = '1.9.0'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    compileSdkVersion 34

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 34

        // CMake build is optional - only if native source exists
        if (file("../src/CMakeLists.txt").exists()) {
            // Check if FreeTDS is built
            def freetdsInclude = file("src/main/cpp/freetds/include").exists() ? 
                file("src/main/cpp/freetds/include").absolutePath : null
            def freetdsLibDir = file("src/main/jniLibs").exists() ? 
                file("src/main/jniLibs").absolutePath : null
            
            externalNativeBuild {
                cmake {
                    arguments "-DANDROID_STL=c++_shared"
                    if (freetdsInclude != null && freetdsLibDir != null) {
                        arguments "-DFREETDS_INCLUDE_DIR=${freetdsInclude}"
                        arguments "-DFREETDS_LIBRARY_DIR=${freetdsLibDir}"
                    }
                    cppFlags "-std=c++11"
                }
            }

            ndk {
                abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
            }
        }
    }

    // CMake is optional
    if (file("../src/CMakeLists.txt").exists()) {
        externalNativeBuild {
            cmake {
                path "../src/CMakeLists.txt"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    sourceSets {
        main {
            java.srcDirs = ['src/main/java']
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    namespace 'com.mssql.mssql_io'
}

dependencies {
    implementation 'androidx.annotation:annotation:1.7.0'
}

